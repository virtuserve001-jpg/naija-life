# ─────────────────────────────────────────────────────────────
#  FLY.IO — https://fly.io   (has a real free allowance)
#    fly auth login
#    fly apps create naija-life
#    fly volumes create naija_world --region lhr --size 1
#    fly deploy
#
#  auto_stop_machines = false is REQUIRED — if the machine sleeps,
#  every WebSocket drops and the world goes dark.
# ─────────────────────────────────────────────────────────────
app = "naija-life"
primary_region = "lhr"          # London — lowest latency to Nigeria

[build]

[env]
  PORT = "8080"
  NAIJA_DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "naija_world"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
